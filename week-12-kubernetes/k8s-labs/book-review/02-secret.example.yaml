# EXAMPLE ONLY: placeholders, never real values. Do not apply this file.
# The real Secret is created from a local file that is never committed:
#   kubectl create secret generic book-review-secrets -n book-review \
#     --from-env-file=$HOME/.config/dmi/book-review-k8s.env
apiVersion: v1
kind: Secret
metadata:
  name: book-review-secrets
  namespace: book-review
  labels:
    app: book-review
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "<generated-root-password>"
  DB_PASS: "<generated-app-user-password>"
  JWT_SECRET: "<generated-jwt-signing-secret>"
