apiVersion: apps/v1
kind: Deployment
metadata:
  name: autohealing-deployment
  labels:
    app: autohealing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: autohealing
  template:
    metadata:
      labels:
        app: autohealing
    spec:
      containers:
        - name: nginx
          image: nginx:1.30.5
          ports:
            - containerPort: 80
