# Read-only cluster identity for Claude Code (DMI Week 12, Assignment 11).
# Claude Code's kubeconfig uses a short-lived token for this ServiceAccount, so the API server itself
# refuses any change, whatever the instructions say. The human recovers with their own credentials.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-triage-reader
  namespace: book-review
  labels:
    app: book-review
---
# Kubernetes' built-in "view" role: read most objects in the namespace (not Secrets) and change nothing
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8s-triage-reader-view
  namespace: book-review
  labels:
    app: book-review
subjects:
  - kind: ServiceAccount
    name: k8s-triage-reader
    namespace: book-review
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
---
# The script's preflight reads the namespace object itself, which is cluster-scoped: allow exactly that one
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-triage-namespace-reader
  labels:
    app: book-review
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: ["book-review"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-triage-namespace-reader
  labels:
    app: book-review
subjects:
  - kind: ServiceAccount
    name: k8s-triage-reader
    namespace: book-review
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-triage-namespace-reader
