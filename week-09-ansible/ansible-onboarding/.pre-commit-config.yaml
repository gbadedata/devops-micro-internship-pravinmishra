# Pre-commit hooks for the ansible-onboarding workspace (Oluwagbade Odimayo).
# Versions are pinned so every machine runs identical checks.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  - repo: https://github.com/ansible/ansible-lint
    rev: v26.9.0
    hooks:
      - id: ansible-lint
        # Upstream hook asks for python3.14; run it on this machine's Python 3.12 instead.
        language_version: python3
        # Same Ansible package as requirements.txt, so collections like ansible.posix resolve in the hook.
        additional_dependencies:
          - ansible==14.4.0
