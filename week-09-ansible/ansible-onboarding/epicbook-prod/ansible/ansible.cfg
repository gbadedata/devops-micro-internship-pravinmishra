# Ansible settings for the EpicBook deployment (Oluwagbade Odimayo).
# Run every command from this ansible/ directory so this file is picked up.

[defaults]
inventory = inventory.ini
roles_path = roles
remote_user = ubuntu
private_key_file = ~/.ssh/id_ed25519
# Temporary lab only: the VM is rebuilt with a new host key each time. Never use in production.
host_key_checking = False
interpreter_python = auto_silent
callback_result_format = yaml
retry_files_enabled = False
forks = 10
nocows = True

[privilege_escalation]
become = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
