---
- name: Check the database settings were supplied
  ansible.builtin.assert:
    that:
      - db_host | length > 0
      - db_password | length > 0
    fail_msg: "Export EPICBOOK_DB_HOST and EPICBOOK_DB_PASSWORD on the controller before running the playbook"
    quiet: true

- name: Install Node.js and npm
  ansible.builtin.apt:
    name:
      - nodejs
      - npm
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags: [node]

- name: Install PM2 globally
  community.general.npm:
    name: pm2
    global: true
    state: present

- name: Clone the EpicBook repository
  ansible.builtin.git:
    repo: "{{ app_repo }}"
    dest: "{{ app_dir }}"
    version: "{{ app_version }}"
    depth: 1
  become: true
  become_user: "{{ app_user }}"
  register: epicbook_repo
  notify: Restart EpicBook

- name: Write the PM2 ecosystem file with the database connection (secrets hidden)
  ansible.builtin.template:
    src: ecosystem.config.js.j2
    dest: "{{ epicbook_ecosystem_file }}"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0600"
  no_log: true
  diff: false
  notify: Restart EpicBook

- name: Check whether dependencies are already installed
  ansible.builtin.stat:
    path: "{{ app_dir }}/node_modules"
  register: epicbook_node_modules

- name: Install the application dependencies (new code or missing node_modules only)
  community.general.npm:
    path: "{{ app_dir }}"
    production: true
  become: true
  become_user: "{{ app_user }}"
  when: epicbook_repo.changed or not epicbook_node_modules.stat.exists

- name: Check whether the EpicBook schema already exists
  ansible.builtin.command:
    argv:
      - mysql
      - --host={{ db_host }}
      - --port={{ db_port }}
      - --user={{ db_user }}
      - --batch
      - --skip-column-names
      - --execute=SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='{{ db_name }}' AND table_name='Book'
  environment:
    MYSQL_PWD: "{{ db_password }}"
  register: epicbook_schema_check
  changed_when: false

- name: Import the schema and seed data (first deployment only)
  ansible.builtin.shell: |
    set -o pipefail
    for f in BuyTheBook_Schema.sql author_seed.sql books_seed.sql; do
      mysql --host="{{ db_host }}" --port="{{ db_port }}" --user="{{ db_user }}" "{{ db_name }}" < "db/$f"
    done
  args:
    chdir: "{{ app_dir }}"
    executable: /bin/bash
  environment:
    MYSQL_PWD: "{{ db_password }}"
  when: epicbook_schema_check.stdout | trim == "0"
  changed_when: true

- name: Check whether PM2 already manages EpicBook
  ansible.builtin.command: pm2 describe {{ pm2_app_name }}
  become: true
  become_user: "{{ app_user }}"
  register: epicbook_pm2_describe
  changed_when: false
  failed_when: false

- name: Start EpicBook under PM2
  ansible.builtin.command: pm2 start {{ epicbook_ecosystem_file }}
  become: true
  become_user: "{{ app_user }}"
  when: epicbook_pm2_describe.rc != 0
  changed_when: true

- name: Register PM2 to start at boot
  ansible.builtin.command:
    cmd: pm2 startup systemd -u {{ app_user }} --hp /home/{{ app_user }}
    creates: /etc/systemd/system/pm2-{{ app_user }}.service
  tags: [pm2-startup]

- name: Save the PM2 process list so EpicBook returns after a reboot
  ansible.builtin.command: pm2 save
  become: true
  become_user: "{{ app_user }}"
  changed_when: false

- name: Wait for EpicBook to listen on its port
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ app_port }}"
    timeout: 60
