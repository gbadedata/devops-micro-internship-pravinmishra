---
- name: Wait for cloud-init to finish first-boot package updates
  ansible.builtin.command: cloud-init status --wait
  changed_when: false
  check_mode: false # read-only status check

- name: Install base packages
  ansible.builtin.apt:
    name:
      - git
      - curl
      - acl
      - mysql-client
    state: present
    update_cache: true
    cache_valid_time: 3600

# A6 Task 7: controlled risky change (access and security). Reviewed with --check --diff before applying.
- name: Harden SSH by disabling root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PermitRootLogin"
    line: PermitRootLogin no
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart SSH
