---
- name: Wait for cloud-init to finish first-boot package updates
  ansible.builtin.command: cloud-init status --wait
  changed_when: false

- name: Install base packages
  ansible.builtin.apt:
    name:
      - git
      - curl
      - acl
      - mysql-client
    state: present
    update_cache: true
    cache_valid_time: 3600
