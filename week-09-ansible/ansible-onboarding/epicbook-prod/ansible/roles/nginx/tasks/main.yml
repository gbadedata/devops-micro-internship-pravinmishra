---
- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Deploy the EpicBook reverse proxy site
  ansible.builtin.template:
    src: epicbook.conf.j2
    dest: /etc/nginx/sites-available/epicbook
    owner: root
    group: root
    mode: "0644"
  notify: Reload Nginx

- name: Enable the EpicBook site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/epicbook
    dest: /etc/nginx/sites-enabled/epicbook
    state: link
  notify: Reload Nginx

- name: Disable the default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload Nginx

- name: Validate the Nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false
  check_mode: false # read-only validation

- name: Ensure Nginx is started and enabled at boot
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
